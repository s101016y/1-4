<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 영화 티어리스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #222;
    }

    .wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    #movieInput {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
    }

    button {
      padding: 12px 16px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #333;
      color: white;
    }

    button:hover {
      background-color: #555;
    }

    #resetBtn {
      background-color: #777;
    }

    #resetBtn:hover {
      background-color: #999;
    }

    .guide {
      margin-bottom: 20px;
      color: #555;
      line-height: 1.5;
    }

    .tier-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tier-row {
      display: flex;
      min-height: 95px;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .tier-label {
      width: 90px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      user-select: none;
    }

    .tier-label.s {
      background-color: #ff5c5c;
    }

    .tier-label.a {
      background-color: #ff9f43;
    }

    .tier-label.b {
      background-color: #feca57;
      color: #222;
    }

    .tier-label.c {
      background-color: #1dd1a1;
      color: #222;
    }

    .card-zone {
      flex: 1;
      min-width: 0;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
    }

    .unranked-box {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
    }

    .unranked-box h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .movie-card {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 9px 10px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background-color: white;
      cursor: grab;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
    }

    .movie-card:active {
      cursor: grabbing;
    }

    .movie-card.selected {
      border-color: #1e90ff;
      background-color: #eaf4ff;
    }

    .movie-title {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .delete-btn {
      flex-shrink: 0;
      padding: 5px 8px;
      font-size: 13px;
      border-radius: 6px;
      background-color: #e74c3c;
      color: white;
    }

    .delete-btn:hover {
      background-color: #c0392b;
    }

    .drag-over {
      outline: 3px dashed #1e90ff;
      outline-offset: -6px;
    }

    @media (max-width: 600px) {
      .wrap {
        padding: 12px;
      }

      .tier-row {
        flex-direction: column;
      }

      .tier-label {
        width: 100%;
        height: 55px;
      }

      .input-area {
        flex-direction: column;
      }

      #movieInput,
      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>내 영화 티어리스트</h1>

    <div class="input-area">
      <input id="movieInput" type="text" placeholder="영화 제목 입력" />
      <button id="addBtn">추가</button>
      <button id="resetBtn">처음으로</button>
    </div>

    <p class="guide">
      카드를 누르고 S·A·B·C 등급 글자를 누르거나, 카드를 끌어 놓으면 해당 칸으로 옮겨집니다.
    </p>

    <div class="tier-list">
      <div class="tier-row">
        <div class="tier-label s" data-tier-label="S">S</div>
        <div class="card-zone" data-tier="S"></div>
      </div>

      <div class="tier-row">
        <div class="tier-label a" data-tier-label="A">A</div>
        <div class="card-zone" data-tier="A"></div>
      </div>

      <div class="tier-row">
        <div class="tier-label b" data-tier-label="B">B</div>
        <div class="card-zone" data-tier="B"></div>
      </div>

      <div class="tier-row">
        <div class="tier-label c" data-tier-label="C">C</div>
        <div class="card-zone" data-tier="C"></div>
      </div>
    </div>

    <div class="unranked-box">
      <h2>아직 안 정한 영화</h2>
      <div class="card-zone" data-tier="none"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "movie-tier-list-delete-version";

    const initialMovieTitles = [
      "기생충",
      "인터스텔라",
      "라라랜드",
      "센과 치히로의 행방불명",
      "어벤져스: 엔드게임",
      "범죄도시",
      "타이타닉",
      "토이 스토리"
    ];

    let movies = [];
    let selectedMovieId = null;

    const movieInput = document.getElementById("movieInput");
    const addBtn = document.getElementById("addBtn");
    const resetBtn = document.getElementById("resetBtn");

    function createInitialMovies() {
      return initialMovieTitles.map(function(title, index) {
        return {
          id: "initial-" + index,
          title: title,
          tier: "none"
        };
      });
    }

    function saveMovies() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
    }

    function loadMovies() {
      const savedData = localStorage.getItem(STORAGE_KEY);

      if (!savedData) {
        movies = createInitialMovies();
        saveMovies();
        return;
      }

      try {
        const parsedData = JSON.parse(savedData);

        if (Array.isArray(parsedData)) {
          movies = parsedData;
        } else {
          movies = createInitialMovies();
          saveMovies();
        }
      } catch (error) {
        movies = createInitialMovies();
        saveMovies();
      }
    }

    function renderMovies() {
      const zones = document.querySelectorAll(".card-zone");

      zones.forEach(function(zone) {
        zone.innerHTML = "";
      });

      movies.forEach(function(movie) {
        const targetZone = document.querySelector('.card-zone[data-tier="' + movie.tier + '"]');

        if (!targetZone) return;

        const card = document.createElement("div");
        card.className = "movie-card";
        card.draggable = true;
        card.dataset.id = movie.id;

        if (movie.id === selectedMovieId) {
          card.classList.add("selected");
        }

        const titleSpan = document.createElement("span");
        titleSpan.className = "movie-title";
        titleSpan.textContent = movie.title;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.type = "button";
        deleteButton.textContent = "삭제";

        card.appendChild(titleSpan);
        card.appendChild(deleteButton);

        card.addEventListener("click", function() {
          selectedMovieId = movie.id;
          renderMovies();
        });

        card.addEventListener("dragstart", function(event) {
          event.dataTransfer.setData("text/plain", movie.id);
        });

        deleteButton.addEventListener("click", function(event) {
          event.stopPropagation();

          const result = confirm("삭제하시겠습니까?");

          if (!result) {
            return;
          }

          movies = movies.filter(function(item) {
            return item.id !== movie.id;
          });

          if (selectedMovieId === movie.id) {
            selectedMovieId = null;
          }

          saveMovies();
          renderMovies();
        });

        targetZone.appendChild(card);
      });
    }

    function moveMovie(movieId, newTier) {
      const movie = movies.find(function(item) {
        return item.id === movieId;
      });

      if (!movie) return;

      movie.tier = newTier;
      saveMovies();
      renderMovies();
    }

    function addMovie() {
      const title = movieInput.value.trim();

      if (title === "") {
        return;
      }

      const newMovie = {
        id: "movie-" + Date.now(),
        title: title,
        tier: "none"
      };

      movies.push(newMovie);
      movieInput.value = "";

      saveMovies();
      renderMovies();
    }

    addBtn.addEventListener("click", addMovie);

    movieInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addMovie();
      }
    });

    resetBtn.addEventListener("click", function() {
      movies = createInitialMovies();
      selectedMovieId = null;
      saveMovies();
      renderMovies();
    });

    const tierLabels = document.querySelectorAll("[data-tier-label]");

    tierLabels.forEach(function(label) {
      label.addEventListener("click", function() {
        if (!selectedMovieId) {
          return;
        }

        const tier = label.dataset.tierLabel;
        moveMovie(selectedMovieId, tier);
      });
    });

    const cardZones = document.querySelectorAll(".card-zone");

    cardZones.forEach(function(zone) {
      zone.addEventListener("dragover", function(event) {
        event.preventDefault();
        zone.classList.add("drag-over");
      });

      zone.addEventListener("dragleave", function() {
        zone.classList.remove("drag-over");
      });

      zone.addEventListener("drop", function(event) {
        event.preventDefault();
        zone.classList.remove("drag-over");

        const movieId = event.dataTransfer.getData("text/plain");
        const newTier = zone.dataset.tier;

        moveMovie(movieId, newTier);
      });
    });

    loadMovies();
    renderMovies();
  </script>
</body>
</html>
