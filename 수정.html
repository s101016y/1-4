<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 영화 티어리스트</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 10px 14px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button:hover {
      background: #555;
    }

    .reset-btn {
      background: #777;
    }

    .reset-btn:hover {
      background: #999;
    }

    .hint {
      margin: 8px 0 18px;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    .tiers {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tier {
      display: grid;
      grid-template-columns: 90px 1fr;
      min-height: 90px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .tier-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      color: white;
    }

    .tier-label.s {
      background: #ff6b6b;
    }

    .tier-label.a {
      background: #ffa94d;
    }

    .tier-label.b {
      background: #ffd43b;
      color: #333;
    }

    .tier-label.c {
      background: #69db7c;
      color: #333;
    }

    .card-area {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .unranked-section {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
    }

    .unranked-title {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .movie-card {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 9px 10px;
      background: #ffffff;
      border: 2px solid #ccc;
      border-radius: 10px;
      cursor: grab;
      word-break: break-word;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    .movie-card:active {
      cursor: grabbing;
    }

    .movie-card.selected {
      border-color: #228be6;
      background: #e7f5ff;
    }

    .movie-title {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .delete-btn {
      flex-shrink: 0;
      padding: 5px 8px;
      font-size: 13px;
      border-radius: 6px;
      background: #e03131;
      color: white;
    }

    .delete-btn:hover {
      background: #c92a2a;
    }

    .drop-over {
      outline: 3px dashed #228be6;
      outline-offset: -6px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 12px;
      }

      .tier {
        grid-template-columns: 1fr;
      }

      .tier-label {
        min-height: 54px;
      }

      .controls {
        flex-direction: column;
      }

      input,
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>내 영화 티어리스트</h1>

    <section class="controls">
      <input id="movieInput" type="text" placeholder="영화 제목 입력" />
      <button id="addBtn">추가</button>
      <button id="resetBtn" class="reset-btn">처음으로</button>
    </section>

    <p class="hint">
      카드 선택 후 S·A·B·C 글자를 누르거나, 카드를 원하는 칸으로 끌어 놓으세요.
      삭제 버튼을 누르면 확인 후 카드가 삭제됩니다.
    </p>

    <section class="tiers">
      <div class="tier" data-tier="S">
        <div class="tier-label s" data-move-tier="S">S</div>
        <div class="card-area" id="tier-S" data-drop-tier="S"></div>
      </div>

      <div class="tier" data-tier="A">
        <div class="tier-label a" data-move-tier="A">A</div>
        <div class="card-area" id="tier-A" data-drop-tier="A"></div>
      </div>

      <div class="tier" data-tier="B">
        <div class="tier-label b" data-move-tier="B">B</div>
        <div class="card-area" id="tier-B" data-drop-tier="B"></div>
      </div>

      <div class="tier" data-tier="C">
        <div class="tier-label c" data-move-tier="C">C</div>
        <div class="card-area" id="tier-C" data-drop-tier="C"></div>
      </div>
    </section>

    <section class="unranked-section">
      <h2 class="unranked-title">아직 안 정한 영화</h2>
      <div class="card-area" id="tier-unranked" data-drop-tier=""></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "my-movie-tier-list-v1";

    const initialMovies = [
      "기생충",
      "인터스텔라",
      "라라랜드",
      "센과 치히로의 행방불명",
      "어벤져스: 엔드게임",
      "범죄도시",
      "타이타닉",
      "토이 스토리"
    ];

    let movies = [];
    let selectedId = null;

    const movieInput = document.getElementById("movieInput");
    const addBtn = document.getElementById("addBtn");
    const resetBtn = document.getElementById("resetBtn");

    function makeInitialMovies() {
      return initialMovies.map((title, index) => ({
        id: "initial-" + index,
        title,
        tier: ""
      }));
    }

    function loadMovies() {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (saved) {
        try {
          movies = JSON.parse(saved);
          return;
        } catch (error) {
          movies = makeInitialMovies();
        }
      } else {
        movies = makeInitialMovies();
      }
    }

    function saveMovies() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
    }

    function render() {
      const containers = document.querySelectorAll("[data-drop-tier]");
      containers.forEach(container => {
        container.innerHTML = "";
      });

      movies.forEach(movie => {
        const containerId = movie.tier ? "tier-" + movie.tier : "tier-unranked";
        const container = document.getElementById(containerId);

        if (!container) return;

        const card = document.createElement("div");
        card.className = "movie-card";
        card.draggable = true;
        card.dataset.id = movie.id;

        if (movie.id === selectedId) {
          card.classList.add("selected");
        }

        const title = document.createElement("span");
        title.className = "movie-title";
        title.textContent = movie.title;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.type = "button";
        deleteBtn.textContent = "삭제";

        card.appendChild(title);
        card.appendChild(deleteBtn);

        card.addEventListener("click", () => {
          selectedId = movie.id;
          render();
        });

        card.addEventListener("dragstart", event => {
          event.dataTransfer.setData("text/plain", movie.id);
        });

        deleteBtn.addEventListener("click", event => {
          event.stopPropagation();

          const ok = confirm("삭제하시겠습니까?");
          if (!ok) return;

          movies = movies.filter(item => item.id !== movie.id);

          if (selectedId === movie.id) {
            selectedId = null;
          }

          saveMovies();
          render();
        });

        container.appendChild(card);
      });
    }

    function moveMovie(movieId, tier) {
      const movie = movies.find(item => item.id === movieId);
      if (!movie) return;

      movie.tier = tier;
      saveMovies();
      render();
    }

    function addMovie() {
      const title = movieInput.value.trim();

      if (title === "") {
        return;
      }

      movies.push({
        id: "movie-" + Date.now() + "-" + Math.random().toString(36).slice(2),
        title,
        tier: ""
      });

      movieInput.value = "";
      saveMovies();
      render();
    }

    addBtn.addEventListener("click", addMovie);

    movieInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addMovie();
      }
    });

    resetBtn.addEventListener("click", () => {
      movies = makeInitialMovies();
      selectedId = null;
      saveMovies();
      render();
    });

    document.querySelectorAll("[data-move-tier]").forEach(label => {
      label.addEventListener("click", () => {
        if (!selectedId) return;

        const tier = label.dataset.moveTier;
        moveMovie(selectedId, tier);
      });
    });

    document.querySelectorAll("[data-drop-tier]").forEach(area => {
      area.addEventListener("dragover", event => {
        event.preventDefault();
        area.classList.add("drop-over");
      });

      area.addEventListener("dragleave", () => {
        area.classList.remove("drop-over");
      });

      area.addEventListener("drop", event => {
        event.preventDefault();
        area.classList.remove("drop-over");

        const movieId = event.dataTransfer.getData("text/plain");
        const tier = area.dataset.dropTier;

        moveMovie(movieId, tier);
      });
    });

    loadMovies();
    render();
  </script>
</body>
</html>
