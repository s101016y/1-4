<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 영화 티어리스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .add-area {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    #movieInput {
      flex: 1;
      min-width: 180px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 14px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    #resetBtn {
      background: #777;
    }

    #resetBtn:hover {
      background: #999;
    }

    .description {
      margin-bottom: 18px;
      color: #555;
      line-height: 1.5;
    }

    .tier-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tier-row {
      display: flex;
      min-height: 90px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .tier-name {
      width: 90px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      user-select: none;
    }

    .tier-s {
      background: #ff6b6b;
    }

    .tier-a {
      background: #ffa94d;
    }

    .tier-b {
      background: #ffd43b;
      color: #222;
    }

    .tier-c {
      background: #69db7c;
      color: #222;
    }

    .movie-area {
      flex: 1;
      min-width: 0;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
    }

    .unranked {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
    }

    .unranked h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .movie-card {
      position: relative;
      padding: 12px 28px 10px 12px;
      background: white;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: grab;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
      max-width: 100%;
      word-break: break-word;
    }

    .movie-card:active {
      cursor: grabbing;
    }

    .movie-card.selected {
      border-color: #228be6;
      background: #e7f5ff;
    }

    .movie-card.drag-over {
      outline: 3px dashed #228be6;
    }

    .movie-title {
      display: block;
      overflow-wrap: anywhere;
    }

    /* 삭제 기능을 위해 추가한 부분: 카드 오른쪽 상단의 작은 X 버튼 */
    .delete-btn {
      position: absolute;
      top: 3px;
      right: 4px;
      width: 18px;
      height: 18px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #e03131;
      color: white;
      font-size: 13px;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #c92a2a;
    }

    .drop-over {
      outline: 3px dashed #228be6;
      outline-offset: -6px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .tier-row {
        flex-direction: column;
      }

      .tier-name {
        width: 100%;
        height: 54px;
      }

      .add-area {
        flex-direction: column;
      }

      #movieInput,
      button {
        width: 100%;
      }

      .delete-btn {
        width: 18px;
        height: 18px;
        line-height: 18px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>내 영화 티어리스트</h1>

    <div class="add-area">
      <input id="movieInput" type="text" placeholder="영화 제목 입력" />
      <button id="addBtn">추가</button>
      <button id="resetBtn">처음으로</button>
    </div>

    <p class="description">
      카드를 누르고 등급 글자를 누르거나, 카드를 끌어 놓으면 해당 칸으로 옮겨집니다.
    </p>

    <div class="tier-list">
      <div class="tier-row">
        <div class="tier-name tier-s" data-tier-button="S">S</div>
        <div class="movie-area" data-tier="S"></div>
      </div>

      <div class="tier-row">
        <div class="tier-name tier-a" data-tier-button="A">A</div>
        <div class="movie-area" data-tier="A"></div>
      </div>

      <div class="tier-row">
        <div class="tier-name tier-b" data-tier-button="B">B</div>
        <div class="movie-area" data-tier="B"></div>
      </div>

      <div class="tier-row">
        <div class="tier-name tier-c" data-tier-button="C">C</div>
        <div class="movie-area" data-tier="C"></div>
      </div>
    </div>

    <div class="unranked">
      <h2>아직 안 정한 영화</h2>
      <div class="movie-area" data-tier="unranked"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "movie-tier-list";

    const initialMovies = [
      "기생충",
      "인터스텔라",
      "라라랜드",
      "센과 치히로의 행방불명",
      "어벤져스: 엔드게임",
      "범죄도시",
      "타이타닉",
      "토이 스토리"
    ];

    let movies = [];
    let selectedMovieId = null;

    const movieInput = document.getElementById("movieInput");
    const addBtn = document.getElementById("addBtn");
    const resetBtn = document.getElementById("resetBtn");

    function makeInitialMovies() {
      return initialMovies.map(function(title, index) {
        return {
          id: "initial-" + index,
          title: title,
          tier: "unranked"
        };
      });
    }

    function saveMovies() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
    }

    function loadMovies() {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        movies = makeInitialMovies();
        saveMovies();
        return;
      }

      try {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
          movies = parsed;
        } else {
          movies = makeInitialMovies();
          saveMovies();
        }
      } catch (error) {
        movies = makeInitialMovies();
        saveMovies();
      }
    }

    function renderMovies() {
      const areas = document.querySelectorAll(".movie-area");

      areas.forEach(function(area) {
        area.innerHTML = "";
      });

      movies.forEach(function(movie) {
        const area = document.querySelector('.movie-area[data-tier="' + movie.tier + '"]');

        if (!area) return;

        const card = document.createElement("div");
        card.className = "movie-card";
        card.draggable = true;
        card.dataset.id = movie.id;

        if (movie.id === selectedMovieId) {
          card.classList.add("selected");
        }

        const title = document.createElement("span");
        title.className = "movie-title";
        title.textContent = movie.title;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.type = "button";
        deleteBtn.textContent = "×";
        deleteBtn.title = "삭제";

        card.appendChild(title);
        card.appendChild(deleteBtn);

        card.addEventListener("click", function() {
          selectedMovieId = movie.id;
          renderMovies();
        });

        card.addEventListener("dragstart", function(event) {
          event.dataTransfer.setData("text/plain", movie.id);
        });

        deleteBtn.addEventListener("click", function(event) {
          event.stopPropagation();

          const isDelete = confirm("삭제하시겠습니까?");

          if (!isDelete) return;

          movies = movies.filter(function(item) {
            return item.id !== movie.id;
          });

          if (selectedMovieId === movie.id) {
            selectedMovieId = null;
          }

          saveMovies();
          renderMovies();
        });

        area.appendChild(card);
      });
    }

    function moveMovie(movieId, tier) {
      const movie = movies.find(function(item) {
        return item.id === movieId;
      });

      if (!movie) return;

      movie.tier = tier;
      saveMovies();
      renderMovies();
    }

    function addMovie() {
      const title = movieInput.value.trim();

      if (title === "") {
        return;
      }

      movies.push({
        id: "movie-" + Date.now(),
        title: title,
        tier: "unranked"
      });

      movieInput.value = "";
      saveMovies();
      renderMovies();
    }

    addBtn.addEventListener("click", addMovie);

    movieInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addMovie();
      }
    });

    resetBtn.addEventListener("click", function() {
      movies = makeInitialMovies();
      selectedMovieId = null;
      saveMovies();
      renderMovies();
    });

    document.querySelectorAll("[data-tier-button]").forEach(function(button) {
      button.addEventListener("click", function() {
        if (!selectedMovieId) return;

        const tier = button.dataset.tierButton;
        moveMovie(selectedMovieId, tier);
      });
    });

    document.querySelectorAll(".movie-area").forEach(function(area) {
      area.addEventListener("dragover", function(event) {
        event.preventDefault();
        area.classList.add("drop-over");
      });

      area.addEventListener("dragleave", function() {
        area.classList.remove("drop-over");
      });

      area.addEventListener("drop", function(event) {
        event.preventDefault();
        area.classList.remove("drop-over");

        const movieId = event.dataTransfer.getData("text/plain");
        const tier = area.dataset.tier;

        moveMovie(movieId, tier);
      });
    });

    loadMovies();
    renderMovies();
  </script>
</body>
</html>
