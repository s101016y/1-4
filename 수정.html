<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 영화 티어리스트</title>

  <style>
    :root {
      --paper: #faf8f3;
      --ink: #242922;
      --muted: #5f685d;
      --line: #d9dad1;
      --green: #276453;
      --danger: #a55239;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100% - 32px, 860px);
      margin: 32px auto 48px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 34px);
      line-height: 1.25;
    }

    .sub {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .tools input {
      flex: 1 1 180px;
      min-width: 0;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      font: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .tools button {
      padding: 10px 15px;
      border: 1px solid var(--green);
      border-radius: 12px;
      font-weight: 700;
      background: var(--green);
      color: #fff;
    }

    .tools .reset {
      background: #fff;
      color: var(--green);
    }

    #message {
      min-height: 26px;
      margin: 14px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .tiers {
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      min-height: 90px;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .row.over {
      outline: 3px solid var(--green);
      outline-offset: 1px;
    }

    .label {
      width: 64px;
      flex-shrink: 0;
      border: 0;
      color: white;
      font-size: 26px;
      font-weight: 800;
      padding: 12px 4px;
    }

    .S .label {
      background: #a55239;
    }

    .A .label {
      background: #b4763e;
    }

    .B .label {
      background: #276453;
    }

    .C .label {
      background: #67725d;
    }

    .drop {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 9px;
      padding: 12px;
      min-height: 88px;
    }

    .pool {
      margin-top: 22px;
    }

    .pool-head {
      margin: 0 0 8px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
      text-align: left;
    }

    #pool {
      border: 1.5px dashed var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .card {
      position: relative;
      width: 110px;
      min-height: 64px;
      padding: 8px 30px 8px 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.35;
      overflow-wrap: anywhere;
      color: var(--ink);
      cursor: grab;
      text-align: left;
    }

    .card[aria-pressed="true"] {
      outline: 3px solid var(--green);
      outline-offset: 2px;
    }

    .delete {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--muted);
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      padding: 0;
    }

    .delete:hover {
      background: #fff;
      color: var(--danger);
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    /* 삭제 확인 팝업 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.35);
      z-index: 9999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(100%, 360px);
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
      padding: 22px;
      text-align: center;
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .modal p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal-actions button {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .modal-actions .danger {
      border-color: var(--danger);
      background: var(--danger);
      color: #fff;
    }

    :focus-visible {
      outline: 3px solid #ba613a;
      outline-offset: 3px;
    }

    @media (max-width: 420px) {
      .label {
        width: 48px;
      }

      .card {
        width: 92px;
      }

      .drop {
        padding: 10px;
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>내 영화 티어리스트</h1>
      <p class="sub">
        영화를 선택한 뒤 S·A·B·C 등급으로 옮겨 보세요.
        카드를 끌어서 놓을 수도 있고, × 버튼을 누르면 삭제 확인 팝업이 뜹니다.
      </p>
    </header>

    <form class="tools" id="add-form">
      <input id="title" aria-label="영화 제목" placeholder="영화 제목 추가" maxlength="80">
      <button type="submit">추가</button>
      <button type="button" class="reset" id="reset">처음으로</button>
    </form>

    <p id="message" role="status">영화를 선택해 S·A·B·C로 나누어 보세요.</p>

    <!-- 티어 칸 -->
    <section class="tiers" id="tiers" aria-label="영화 등급"></section>

    <!-- 영화 리스트 -->
    <section class="pool" aria-label="아직 안 정한 영화">
      <button class="pool-head" id="pool-label" type="button">
        아직 안 정한 영화
      </button>
      <div class="drop" id="pool" data-tier="pool"></div>
    </section>

    <p class="note">
      같은 브라우저에서 이 파일을 다시 열면 정리한 목록이 유지됩니다.
    </p>
  </main>

  <!-- 삭제 확인 팝업 -->
  <div class="modal-backdrop" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title">
    <div class="modal">
      <h2 id="delete-title">삭제하시겠습니까?</h2>
      <p id="delete-message">이 영화 카드를 삭제합니다.</p>
      <div class="modal-actions">
        <button type="button" id="cancel-delete">취소</button>
        <button type="button" class="danger" id="confirm-delete">삭제</button>
      </div>
    </div>
  </div>

  <script>
    const KEY = "movie-tier-list-delete-modal-v1";

    const LEVELS = ["S", "A", "B", "C", "pool"];

    const DEFAULT_TITLES = [
      "기생충",
      "인터스텔라",
      "라라랜드",
      "센과 치히로의 행방불명",
      "어벤져스: 엔드게임",
      "범죄도시",
      "타이타닉",
      "토이 스토리"
    ];

    const COLORS = [
      "#f2e6dc",
      "#e3eee7",
      "#ede7f6",
      "#fcefd9",
      "#e2ecf4",
      "#f6e3e3"
    ];

    function createInitialState() {
      return {
        nextId: DEFAULT_TITLES.length + 1,
        items: DEFAULT_TITLES.map((title, index) => ({
          id: "m" + (index + 1),
          title,
          tier: "pool"
        }))
      };
    }

    let state = createInitialState();
    let selected = null;
    let pendingDeleteId = null;

    load();

    function load() {
      try {
        const stored = JSON.parse(localStorage.getItem(KEY) || "null");

        if (
          stored &&
          Number.isSafeInteger(stored.nextId) &&
          Array.isArray(stored.items) &&
          stored.items.every(item =>
            typeof item.id === "string" &&
            typeof item.title === "string" &&
            LEVELS.includes(item.tier)
          )
        ) {
          state = stored;
        }
      } catch {
        state = createInitialState();
      }
    }

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch {
        showMessage("이 브라우저에서는 저장하지 못했어요.");
      }
    }

    function showMessage(message) {
      document.querySelector("#message").textContent = message;
    }

    function moveItem(id, tier) {
      const item = state.items.find(item => item.id === id);

      if (!item || !LEVELS.includes(tier)) return;

      item.tier = tier;
      selected = null;

      save();
      render();
      showMessage('"' + item.title + '"을/를 ' + (tier === "pool" ? "미분류" : tier + "등급") + "으로 옮겼어요.");
    }

    function removeItem(id) {
      const item = state.items.find(item => item.id === id);

      if (!item) return;

      state.items = state.items.filter(item => item.id !== id);

      if (selected === id) {
        selected = null;
      }

      save();
      render();
      showMessage('"' + item.title + '"을/를 삭제했어요.');
    }

    function toggleSelect(item) {
      selected = selected === item.id ? null : item.id;
      render();

      if (selected) {
        showMessage('"' + item.title + '"을/를 선택했어요. 옮길 티어 칸을 눌러 주세요.');
      } else {
        showMessage("선택을 해제했어요.");
      }
    }

    function openDeleteModal(id) {
      const item = state.items.find(item => item.id === id);

      if (!item) return;

      pendingDeleteId = id;

      document.querySelector("#delete-message").textContent =
        '"' + item.title + '" 카드를 삭제합니다.';

      document.querySelector("#delete-modal").classList.add("open");
      document.querySelector("#confirm-delete").focus();
    }

    function closeDeleteModal() {
      pendingDeleteId = null;
      document.querySelector("#delete-modal").classList.remove("open");
    }

    function createCard(item, index) {
      const card = document.createElement("div");
      card.className = "card";
      card.draggable = true;
      card.tabIndex = 0;
      card.dataset.id = item.id;
      card.style.backgroundColor = COLORS[index % COLORS.length];
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", item.title + " 카드");
      card.setAttribute("aria-pressed", String(selected === item.id));

      const title = document.createElement("span");
      title.textContent = item.title;

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "delete";
      deleteButton.textContent = "×";
      deleteButton.setAttribute("aria-label", item.title + " 삭제");

      card.append(title, deleteButton);

      card.addEventListener("click", event => {
        event.stopPropagation();
        toggleSelect(item);
      });

      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleSelect(item);
        }
      });

      card.addEventListener("dragstart", event => {
        event.dataTransfer.setData("text/plain", item.id);
      });

      deleteButton.addEventListener("click", event => {
        event.stopPropagation();
        openDeleteModal(item.id);
      });

      deleteButton.addEventListener("pointerdown", event => {
        event.stopPropagation();
      });

      return card;
    }

    function connectDropArea(element, tier) {
      element.addEventListener("dragover", event => {
        event.preventDefault();

        const row = element.closest(".row");
        if (row) row.classList.add("over");
      });

      element.addEventListener("dragleave", () => {
        const row = element.closest(".row");
        if (row) row.classList.remove("over");
      });

      element.addEventListener("drop", event => {
        event.preventDefault();

        const row = element.closest(".row");
        if (row) row.classList.remove("over");

        const id = event.dataTransfer.getData("text/plain");
        moveItem(id, tier);
      });

      element.addEventListener("click", () => {
